[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyagent"
version = "0.7.1"
description = "Minimal local Ollama terminal coding agent for small LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "textual>=8", "pyperclip>=1.9"]

[project.scripts]
tinyagent = "main:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = ["main", "agent", "config", "context", "ollama", "permissions",
              "sessions", "tui"]
packages = ["tools"]
