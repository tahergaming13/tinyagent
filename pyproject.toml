[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyagent"
version = "0.2.0"
description = "Minimal local Ollama terminal coding agent for small LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
tinyagent = "main:main"

[tool.setuptools]
py-modules = ["main", "agent", "config", "context", "ollama", "permissions"]
packages = ["tools"]
